name: JFrog Artifactory Build and Xray Scan

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'idan-main'

env:
  JFROG_CLI_BUILD_NAME: spring-petclinic
  JFROG_CLI_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Install Maven 3.9.9
        run: |
          curl -sL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz \
            | tar xz -C /opt
          echo "/opt/apache-maven-3.9.9/bin" >> $GITHUB_PATH

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Configure Maven to resolve and deploy via Artifactory
        run: |
          jf mvn-config \
            --repo-resolve-releases=petclinic-virtual \
            --repo-resolve-snapshots=petclinic-virtual \
            --repo-deploy-releases=petclinic-libs-release-local \
            --repo-deploy-snapshots=petclinic-libs-snapshot-local

      - name: Build and deploy artifact via JFrog CLI
        run: jf mvn clean deploy -B

      - name: Publish build info to Artifactory
        run: jf rt build-publish

      - name: Trigger Xray security scan (non-failing)
        run: jf build-scan --fail=false
        continue-on-error: true
